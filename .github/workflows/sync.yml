name: Cloud LETUS Sync & Deadline Radar

on:
  schedule:
    # 毎時10分に自動実行 (24時間完全自動巡回)
    - cron: '10 * * * *'
  workflow_dispatch: # 手動実行ボタン
  push:
    paths:
      - '.github/workflows/**'

permissions:
  contents: write # 課題データをリポジトリにコミット・プッシュする権限

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git identity
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Run LETUS Sync
        env:
          LETUS_CALENDAR_URL: ${{ secrets.LETUS_CALENDAR_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python sync_letus.py

      - name: Sync Calendar URL to Render Bot
        run: |
          curl -s -X POST "https://task-radar-us.onrender.com/api/set-calendar-url" \
            -H "Content-Type: application/json" \
            -d "{\"url\":\"${{ secrets.LETUS_CALENDAR_URL }}\",\"secret\":\"TASK_RADAR_SECURE_SYNC_2026\"}" || true

      - name: Check Deadlines & Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python check_deadlines.py

      - name: Commit and push if assignments changed
        run: |
          git add assignments.json assignments.js ignored_titles.json
          if git diff --staged --quiet; then
            echo "No changes in assignments data."
          else
            git commit -m "Auto-sync LETUS assignments [skip ci]"
            for i in {1..5}; do
              git pull --rebase -X theirs origin main || git rebase --abort || true
              git push origin main && break || {
                echo "Push retry in 3s..."
                sleep 3
              }
            done
          fi
